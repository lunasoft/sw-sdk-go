name: CI

on:
  pull_request:
  workflow_dispatch:

# Permisos minimos: el workflow solo necesita leer el codigo.
permissions:
  contents: read

# Maximo una ejecucion a la vez en todo el repositorio. Las demas esperan en
# cola y nunca se cancela una en curso (las pruebas golpean el servicio de pruebas).
concurrency:
  group: sw-sdk-go-ci
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SW_USER: ${{ secrets.SDKTEST_USER }}
      SW_PASSWORD: ${{ secrets.SDKTEST_PASSWORD }}
      SW_TOKEN: ${{ secrets.SDKTEST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # En serie para no colisionar en el servicio de pruebas.
      - run: go test -p 1 ./...
